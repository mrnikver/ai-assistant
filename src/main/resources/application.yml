llm:
  base-url: http://192.168.0.112:11434
  model: qwen3:8b

assistant:
  history-limit: 10

agent:
  max-iterations: 5

trace:
  max-entries: 500

embedding:
  base-url: http://192.168.0.112:11434
  model: embeddinggemma

qdrant:
  base-url: http://192.168.0.112:6333
  collection: deployment-runbook

spring:
  datasource:
    url: jdbc:postgresql://192.168.0.112:5432/ai_assistant
    username: ai_user
    password: ai_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

logging:
  level:
    root: INFO
    com.mykyta: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-} conversationId=%X{conversationId:-} %logger{36} - %msg%n"
