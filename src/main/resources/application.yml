llm:
  base-url: http://192.168.0.112:11434
  model: qwen3:8b

assistant:
  history-limit: 10

agent:
  supervisor-max-iterations: 4
  knowledge-max-iterations: 3
  runtime-max-iterations: 3

trace:
  max-entries: 500
  llm-preview-max-chars: 500

embedding:
  base-url: http://192.168.0.112:11434
  model: embeddinggemma

qdrant:
  base-url: http://192.168.0.112:6333
  collection: deployment-runbook

rag:
  reset-on-startup: false

project-knowledge:
  enabled: true
  roots:
    - ${PROJECT_KNOWLEDGE_BACKEND_ROOT:${user.dir}}
    - ${PROJECT_KNOWLEDGE_UI_ROOT:${user.dir}/../ai-assistant-ui}
  max-chunk-characters: 2400

spring:
  datasource:
    url: jdbc:postgresql://192.168.0.112:5432/ai_assistant
    username: ai_user
    password: ai_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

logging:
  level:
    root: INFO
    com.mykyta: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{24} - %msg%n"
#    console: "%d{HH:mm:ss.SSS} %-5level request=%X{requestId:-} conv=%X{conversationId:-} %logger{24} - %msg%n"
